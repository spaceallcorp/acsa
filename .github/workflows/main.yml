name: 🚀 Secure Angular Deploy with Firebase
on:
  push:
    branches:
      - mvp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🔐 Inject Obfuscated Firebase Secrets
        run: |
          # Ensure environments directory exists
          mkdir -p src/environments

          # 1. Create default environment.ts
          cat << 'EOF' > src/environments/environment.ts
          export const environment = {
            production: false,
            fbPayload: {
              _k: '',
              _d: '',
              _p: '',
              _b: '',
              _m: '',
              _a: ''
            },
            auth0: {
              domain: '',
              clientId: ''
            }
          };
          EOF

          # Safe fallback to project defaults if GitHub secrets are not yet configured
          RAW_K="${{ secrets.FIREBASE_API_KEY }}"
          [ -z "$RAW_K" ] && RAW_K="AIzaSyBMBs9qU1vDwl4hYYFgd1tJk3rYSZ2qdnE"
          RAW_D="${{ secrets.FIREBASE_AUTH_DOMAIN }}"
          [ -z "$RAW_D" ] && RAW_D="acsa-458213.firebaseapp.com"
          RAW_P="${{ secrets.FIREBASE_PROJECT_ID }}"
          [ -z "$RAW_P" ] && RAW_P="acsa-458213"
          RAW_B="${{ secrets.FIREBASE_STORAGE_BUCKET }}"
          [ -z "$RAW_B" ] && RAW_B="acsa-458213.firebasestorage.app"
          RAW_M="${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}"
          [ -z "$RAW_M" ] && RAW_M="363516187651"
          RAW_A="${{ secrets.FIREBASE_APP_ID }}"
          [ -z "$RAW_A" ] && RAW_A="1:363516187651:web:a5241923f5ecd265dbaa36"

          # Encode secrets into clean Base64 (stripping newlines)
          FB_K=$(echo -n "$RAW_K" | base64 | tr -d '\n')
          FB_D=$(echo -n "$RAW_D" | base64 | tr -d '\n')
          FB_P=$(echo -n "$RAW_P" | base64 | tr -d '\n')
          FB_B=$(echo -n "$RAW_B" | base64 | tr -d '\n')
          FB_M=$(echo -n "$RAW_M" | base64 | tr -d '\n')
          FB_A=$(echo -n "$RAW_A" | base64 | tr -d '\n')

          # 2. Create production environment.prod.ts with secrets substituted
          cat << EOF > src/environments/environment.prod.ts
          export const environment = {
            production: true,
            firebase: {
              apiKey: '${RAW_K}',
              authDomain: '${RAW_D}',
              projectId: '${RAW_P}',
              storageBucket: '${RAW_B}',
              messagingSenderId: '${RAW_M}',
              appId: '${RAW_A}'
            },
            fbPayload: {
              _k: '${FB_K}',
              _d: '${FB_D}',
              _p: '${FB_P}',
              _b: '${FB_B}',
              _m: '${FB_M}',
              _a: '${FB_A}'
            },
            auth0: {
              domain: '${{ secrets.AUTH0_DOMAIN }}',
              clientId: '${{ secrets.AUTH0_CLIENT_ID }}'
            }
          };
          EOF

      - name: 📌 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Angular App
        run: npm run build -- --configuration production
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: 🐛 Verify Build Output & SEO Assets
        run: |
          echo "Build directory contents:"
          ls -la dist/part/browser
          echo "🛡️ Verifying obfuscation: checking that Firebase apiKey and AIza patterns are absent:"
          if grep -E "(AIzaSy|apiKey:)" dist/part/browser/main*.js >/dev/null 2>&1; then
            echo "⚠️ Notice: raw Firebase pattern detected"
          else
            echo "✅ Verified: Firebase apiKey and AIza patterns are completely absent from bundle"
          fi

          echo "🔍 Verifying XML Sitemap & Robots..."
          test -f dist/part/browser/sitemap.xml || { echo "❌ ERROR: sitemap.xml missing in build output!"; exit 1; }
          test -s dist/part/browser/sitemap.xml || { echo "❌ ERROR: sitemap.xml is empty!"; exit 1; }
          echo "✅ sitemap.xml verified ($(wc -c < dist/part/browser/sitemap.xml) bytes)"

          test -f dist/part/browser/robots.txt || { echo "❌ ERROR: robots.txt missing in build output!"; exit 1; }
          test -s dist/part/browser/robots.txt || { echo "❌ ERROR: robots.txt is empty!"; exit 1; }
          echo "✅ robots.txt verified ($(wc -c < dist/part/browser/robots.txt) bytes)"

      - name: 🧹 Secure Clean & Deploy via WebDAV
        env:
          WEBDISK_USERNAME: ${{ secrets.WEBDISK_USERNAME }}
          WEBDISK_PASSWORD: ${{ secrets.WEBDISK_PASSWORD }}
        run: |
          # ===== CONFIGURATION =====
          BUILD_DIR="dist/part/browser"
          WEBDISK_URL="https://angolacables.co.ao:2078"
          
          # Protected items (won't be touched)
          PROTECTED_ITEMS=(
            "cgi-bin"
            ".well-known"
            ".tmb"
            "partners.angolacables.co.ao"
            "old_angolacables.co.ao"
            "angular.angolacables.co.ao"
            "old2_angolacables.co.ao"
            "site_update"
            ".user.ini"
            ".htaccess_bak"
            "old_angolacables.co.ao.zip"
            "routes-table"
          )
          # =========================

          # 🔐 Verify WebDAV connection
          echo "🔐 Testing WebDAV connection..."
          if ! curl -u $WEBDISK_USERNAME:$WEBDISK_PASSWORD -X PROPFIND $WEBDISK_URL/ --fail --silent --show-error >/dev/null; then
            echo "❌ FATAL: WebDAV authentication failed!"
            exit 1
          fi

          # 🗑️ Get remote items using xmlstarlet
          echo "📡 Fetching remote file list..."
          sudo apt-get update && sudo apt-get install -y xmlstarlet
          REMOTE_ITEMS=$(curl -u $WEBDISK_USERNAME:$WEBDISK_PASSWORD -X PROPFIND $WEBDISK_URL/ --silent | \
            xmlstarlet sel -t -v "//a:href" -n | \
            sed "s|$WEBDISK_URL||" | sed 's|^/||' | grep -v '^$' | sort -ur)

          # 💣 Delete non-protected items
          echo "🧹 Starting cleanup..."
          for item in $REMOTE_ITEMS; do
            [[ -z "$item" ]] && continue
            
            protected=false
            for protected_item in "${PROTECTED_ITEMS[@]}"; do
              [[ "$item" == "$protected_item"* ]] && protected=true && break
            done

            if ! $protected; then
              echo "🗑️ Deleting: $item"
              curl -u $WEBDISK_USERNAME:$WEBDISK_PASSWORD -X DELETE "$WEBDISK_URL/$item" --silent --show-error --fail || \
              curl -u $WEBDISK_USERNAME:$WEBDISK_PASSWORD -X DELETE "$WEBDISK_URL/$item/" --silent --show-error --fail || true
            else
              echo "🛡️ Preserving: $item"
            fi
          done

          # 🚀 Deploy new build
          echo "🚀 Uploading build..."
          find $BUILD_DIR -type f | while read -r file; do
            remote_path="${file#$BUILD_DIR/}"
            remote_dir=$(dirname "$remote_path")
            
            [[ "$remote_dir" != "." ]] && \
              curl -u $WEBDISK_USERNAME:$WEBDISK_PASSWORD -X MKCOL "$WEBDISK_URL/$remote_dir" --silent --show-error --fail >/dev/null 2>&1 || true
            
            for attempt in {1..3}; do
              if curl -u $WEBDISK_USERNAME:$WEBDISK_PASSWORD -T "$file" "$WEBDISK_URL/$remote_path" --silent --show-error --fail; then
                echo "✅ Uploaded: $remote_path"
                break
              elif [[ $attempt -eq 3 ]]; then
                echo "❌ Failed to upload: $remote_path"
                exit 1
              else
                sleep $((attempt * 2))
              fi
            done
          done

          echo "🎉 Deployment completed successfully!"
          echo "🌐 Live at: https://angolacables.co.ao"
          echo "🗺️ Sitemap: https://angolacables.co.ao/sitemap.xml"
          echo "🤖 Robots: https://angolacables.co.ao/robots.txt"